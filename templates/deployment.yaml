#Deploymen is a higher level abstraction that manages ReplicaSets and provides declarative updates to applications.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  #these are required labels for replicaset to identify the pods it manages. 
  #These labels should match the labels defined in the pod template.
  labels:
    project: roboshop
    component: frontend
    environment: dev
    purpose: deployment-demo
  annotations:
    kubernetes.io/change-cause: {{ .Values.deployment.changeCause }}
spec:
  replicas: " {{ .Values.deployment.replicas }}" #number of pod replicas to be maintained
  selector:
    #using these labels the replicaset will identify the pods it manages.
    matchLabels:
      project: roboshop
      component: frontend
      environment: dev
      purpose: deployment-demo
  #This is the pod template which defines the pod specification. 
  #The deployment will create pods based on this template.
  template:
    metadata:
      labels:
        project: roboshop
        component: frontend
        environment: dev
        purpose: deployment-demo
    spec:
      containers:
      - name: nginx
        image: "nginx:{{ .Values.deployment.imageVersion }}"

#nslook nginx-headless to see the IPs of the individual pods.
#kubectl get pods -o wide to see the IPs of the individual pods.
#cat /etc/os-release to see the os details of the container.
